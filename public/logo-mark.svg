<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Theme Neon Lime Gradient -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFFBD"/>
      <stop offset="45%" stop-color="#DFFF5E"/>
      <stop offset="100%" stop-color="#B3E619"/>
    </linearGradient>

    <!-- Deep Obsidian Emerald Gradient Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164338"/>
      <stop offset="50%" stop-color="#13382F"/>
      <stop offset="100%" stop-color="#0B231D"/>
    </linearGradient>

    <!-- Glowing Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFFF5E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#256B59" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#DFFF5E" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFFF5E" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#DFFF5E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DFFF5E" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Filter Glow for Mark -->
    <filter id="markBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge (512x512) -->
  <rect width="512" height="512" rx="128" fill="url(#bgDark)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Ambient Neon Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#ambientGlow)"/>

  <!-- Tech Circuit Accent Etchings -->
  <path d="M 64 192 H 108 M 404 320 H 448 M 192 64 V 108 M 320 404 V 448" stroke="#DFFF5E" stroke-width="8" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- ================= BESPOKE CYBER MONOGRAM Z ================= -->
  <!-- Upper Wing Blade (Forward Angled Arrow) -->
  <path d="M 128 138 H 378 C 388 138 394 149 388 158 L 338 218 H 228 L 176 178 L 128 138 Z" fill="url(#neonLime)" filter="url(#markBloom)"/>

  <!-- Central Dynamic Energy Diagonal Slash -->
  <path d="M 346 190 L 170 338 H 218 L 384 190 H 346 Z" fill="#FBFFBD" opacity="0.95"/>

  <!-- Lower Wing Blade (Reverse Angled Arrow) -->
  <path d="M 384 374 H 134 C 124 374 118 363 124 354 L 174 294 H 284 L 336 334 L 384 374 Z" fill="url(#neonLime)" filter="url(#markBloom)"/>

  <!-- Accent Tech Beacon Node (.dev) -->
  <circle cx="396" cy="122" r="22" fill="#DFFF5E"/>
</svg>
